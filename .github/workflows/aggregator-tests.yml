name: aggregator tests

on:
  push:
    branches: [main]
    paths:
      - "election-aggregator/**"
      - ".github/workflows/aggregator-tests.yml"
  pull_request:
    paths:
      - "election-aggregator/**"
      - ".github/workflows/aggregator-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: election-aggregator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: election-aggregator/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q
